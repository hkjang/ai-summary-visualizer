<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>요약 & 시각화</title>
  <!-- 최신 FontAwesome -->
  <link href="/static/all.min.css" rel="stylesheet">
  <link href="/static/fontawesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/easymde.min.css">
  <script src="/static/easymde.min.js"></script>
  <script src="/static/axios.min.js"></script>
  <script src="/static/mermaid.min.js"></script>
  <style>
    @font-face {
      font-family: "Font Awesome 6 Free";
      font-style: normal;
      font-weight: 900;
      src: url("/webfonts/fa-solid-900.woff2") format("woff2"),
           url("/webfonts/fa-solid-900.woff") format("woff"),
           url("/webfonts/fa-solid-900.ttf") format("truetype");
    }

    .fa {
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-style: normal;
      display: inline-block;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #003366;
      margin-bottom: 30px;
    }

    form {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    textarea[name="text"] {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
      box-sizing: border-box;
    }

    select, button {
      padding: 10px 15px;
      margin-top: 15px;
      margin-right: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #aaa;
      background-color: #f0f0f0;
      transition: 0.3s;
    }

    select:hover, button:hover {
      background-color: #e0eaff;
      cursor: pointer;
    }

    button {
      background-color: #0055cc;
      color: white;
      border: none;
    }

    button:hover {
      background-color: #0044aa;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
      justify-content: center;
    }

    .editor-layout, .diagram {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 20px;
      flex: 1 1 45%;
      min-width: 300px;
    }

    .diagram {
      background: #f8fafc;
      border: 1px solid #d0d7de;
      overflow-x: auto;
    }

    h2 {
      margin-bottom: 10px;
      color: #222;
    }
   /* EasyMDE 편집기 커스터마이징 */
    .EasyMDEContainer {
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      background-color: white;
    }

    .CodeMirror {
      font-family: 'Noto Sans KR', monospace;
      font-size: 15px;
      line-height: 1.6;
      background-color: #ffffff;
    }
    .editor-toolbar button.active, .editor-toolbar button:hover{
        background-color: #b1c1ffa1;
    }
    .editor-toolbar.fullscreen {
        background-color: #003db5;
    }
    .editor-toolbar {
      background-color: #003db5;
      border-bottom: 1px solid #ddd;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .editor-toolbar a {
      color: #444 !important;
      border: none;
    }

    .editor-toolbar a:hover {
      background-color: #e0e7ff;
    }

    .editor-statusbar {
      display: none;
    }

    .editor-preview.custom-preview {
      padding: 20px;
      font-size: 16px;
      background-color: #fcfcfc;
      color: #222;
    }
    @media (max-width: 800px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <h1>AI 요약 & 시각화</h1>
  <form method="post">
    <textarea name="text" rows="10" placeholder="텍스트를 입력하세요" required></textarea><br>
    <label for="style">스타일:</label>
    <select name="style">
      <option value="general">일반 요약</option>
      <option value="keywords">핵심 키워드</option>
      <option value="pros_cons">장단점 분석</option>
      <option value="table_summary">정리 표</option>
      <option value="faq">FAQ 생성</option>
      <option value="topic">토픽별 분류</option>
      <option value="brief_detail">요점 vs 부연</option>
      <option value="bullet">항목 정리</option>
    </select>
    <label for="lang">언어:</label>
    <select name="lang">
      <option value="ko">한국어</option>
      <option value="en">영어</option>
    </select>
    <button type="submit">요약하기</button>
  </form>

  {% if summary %}
    <div class="container">
      <div class="editor-layout">
        <h2>요약 결과</h2>
        <textarea id="editor">{{ summary }}</textarea>
      </div>
      <div class="diagram">
        <h2>Mermaid 시각화</h2>
        <div id="mermaid-diagram">로딩 중...</div>
      </div>
    </div>

    <script>
        const easyMDE = new EasyMDE({
            element: document.getElementById("editor"),
            autofocus: true,
            spellChecker: false,
            status: false,
            minHeight: "300px",
            renderingConfig: {
              singleLineBreaks: false,
              codeSyntaxHighlighting: true
            },
            previewClass: ["editor-preview", "custom-preview"],
         });

  easyMDE.togglePreview();
      async function fetchMermaidDiagram() {
        try {
          const content = easyMDE.value();
          if (!content.trim()) throw new Error("내용이 비어 있습니다.");

          const response = await axios.post('/diagram', {
            question: content
          }, {
            headers: { 'Content-Type': 'application/json' }
          });

          document.getElementById('mermaid-diagram').innerHTML = response.data.mermaid;
          mermaid.init(undefined, "#mermaid-diagram");

        } catch (err) {
          document.getElementById('mermaid-diagram').innerHTML =
            "Mermaid 생성 실패: " + (err.response?.data?.message || err.message || err);
        }
      }

      window.onload = fetchMermaidDiagram;
    </script>
  {% endif %}
</body>
</html>
